[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enmf-recsys"
version = "0.1.0"
description = "Рекомендательный алгоритм на матричном разложении с неявной обратной связью (ENMF) на PyTorch"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "pandas>=2.1",
    "PyYAML>=6.0",
    "tensorboard>=2.15",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
enmf = "enmf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
