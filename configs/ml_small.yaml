# Быстрая отладка на ml-latest-small (610 пользователей, ~3650 объектов).
#
# Только для проверки конвейера на реальном CSV. Здесь пользователей меньше,
# чем объектов, поэтому по условию задания уместнее был бы item-based вариант:
# при подготовке данных об этом будет предупреждение в логе.

data:
  dataset: ml-latest-small
  data_dir: data
  binarize_threshold: 0.0      # любая оценка = положительное взаимодействие
  min_user_interactions: 5
  min_item_interactions: 5
  split_strategy: per_user     # global здесь вырождается: оценимы 25 пользователей из 122
  val_ratio: 0.2
  max_history: null

model:
  embedding_dim: 64
  dropout: 0.3
  init_std: 0.01

loss:
  pos_weight: 1.0
  neg_weight: 0.1              # главный гиперпараметр ENMF
  l2_reg: 0.0

train:
  epochs: 100
  batch_size: 256
  lr: 0.05
  weight_decay: 0.0
  num_workers: 0
  eval_every: 1
  early_stopping_patience: 10
  early_stopping_metric: ndcg@10
  seed: 42
  device: auto
  ddp_backend: auto
  grad_clip: 0.0

eval:
  ks: [5, 10, 20]
  batch_size: 512

output:
  run_name: enmf_ml_small
  output_dir: runs
  tensorboard: true
  save_checkpoint: true
