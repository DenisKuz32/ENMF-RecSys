# Смоук-прогон на синтетике: без сети, около 10 секунд на CPU.
#
# 800 пользователей, 200 объектов, взаимодействия порождены латентной
# структурой (enmf.data.dataset.make_synthetic_interactions), поэтому
# факторизационная модель должна обыгрывать популярность. Параметры ниже
# подобраны так, чтобы это было наглядно: на сидах 42, 1, 2 прирост NDCG@10 к
# популярности +15%, +10%, +7%. С параметрами ML-1M (neg_weight=0.1, d=64)
# выигрыша на синтетике почти нет.

data:
  dataset: synthetic
  data_dir: data
  binarize_threshold: 0.0      # любая оценка = положительное взаимодействие
  min_user_interactions: 5
  min_item_interactions: 5
  split_strategy: per_user     # генератор выдаёт историю каждого пользователя одним
                               # куском по времени, и global здесь вырождается
  val_ratio: 0.2
  max_history: null

model:
  embedding_dim: 32
  dropout: 0.3
  init_std: 0.01

loss:
  pos_weight: 1.0
  neg_weight: 0.3              # главный гиперпараметр ENMF
  l2_reg: 0.0

train:
  epochs: 60                   # ранняя остановка срабатывает около 40-й эпохи
  batch_size: 64
  lr: 0.05
  weight_decay: 0.0
  num_workers: 0
  eval_every: 1
  early_stopping_patience: 10
  early_stopping_metric: ndcg@10
  seed: 42
  device: auto
  ddp_backend: auto
  grad_clip: 0.0

eval:
  ks: [5, 10, 20]
  batch_size: 512

output:
  run_name: enmf_synthetic
  output_dir: runs
  tensorboard: true
  save_checkpoint: true
